<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="utility.css">
  <title> Myspotify</title>
</head>

<body>
  <div class="container flex">
    <div class="left m1">
      <div class="close">
        <img src="img/close.svg" alt="">
      </div>
      <div class="home rounded m1 p1">
        <div><img width="120" class="invert" src="img/logo.svg" alt="spotify"></div>
        <ul>
          <li><img class="invert" src="img/home.svg" alt="home">Home</li>
          <li><img class="invert" src="img/search.svg" alt="search">Search</li>
        </ul>
      </div>

      <div class="library rounded m1 p1">
        <div class="heading flex">
          <img class="invert" src="img/playlist.svg" alt="playlist">
          <h2>
            Your Library
          </h2>
        </div>

        <div class="songlist">
          <ul>

          </ul>
        </div>

        <div class="footer">
          <div><a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a></div>
          <div><a href="https://www.spotify.com/jp/privacy/"><span>Privacy Center</span></a></div>
          <div><a href="https://www.spotify.com/jp/legal/privacy-policy/"><span>Privacy Policy</span></a>
          </div>
          <div><a href="https://www.spotify.com/jp/legal/cookies-policy/"><span>Cookies</span></a></div>
          <div><a href="https://www.spotify.com/jp/legal/privacy-policy/#s3"><span>About Ads</span></a></div>
          <div><a href="https://www.spotify.com/jp/accessibility/"><span>Accessibility</span></a></div>
        </div>
      </div>
    </div>

    <div class="right rounded">

      <div class="header rounded">
        <div class="nav">
          <img class="hamburger" src="img/hamburger.svg" alt="">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M15 6L9.70711 11.2929C9.37377 11.6262 9.20711 11.7929 9.20711 12C9.20711 12.2071 9.37377 12.3738 9.70711 12.7071L15 18"
              stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M9 18L14.2929 12.7071C14.6262 12.3738 14.7929 12.2071 14.7929 12C14.7929 11.7929 14.6262 11.6262 14.2929 11.2929L9 6"
              stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <div class="buttons">
          <button class="signbtn">Sign up</button>
          <button class="logbtn">Log in</button>
        </div>
      </div>

      <div class="spotifyplaylist p1 m1 ">
        <h1>Spotify Hits</h1>
        <div class="cardcontainer ">




        </div>

        <div class="playbar ">

          <div class="abovebar">

            <div class="songinfo">

            </div>

            <div class="playbarbtns ">
              <img id="previous" src="img/prevsong.svg" alt="">
              <img id="play" src="img/play.svg" alt="">
              <img id="next" src="img/nextsong.svg" alt="">
            </div>

            <div class="timevolume">
              <div class="songtime">
                00:00 / 00:00
              </div>

              <div class="volume invert">
                <img src="img/volume.svg" alt="">
                <div class="range">
                  <input style="cursor: pointer;" type="range" name="volume" id="volumebar">
                </div>
              </div>

            </div>

          </div>

          <div class="seekbar">
            <div class="seekcircle">

            </div>
          </div>
        </div>

      </div>
    </div>

  </div>
  <script src="script.js"></script>
</body>

</html>
